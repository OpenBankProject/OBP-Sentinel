<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Fixed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
// The theme chosen on the main page, if any
try { const t = localStorage.getItem('sentinel-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #F4F5F2; --surface: #FFFFFF; --ink: #16181D; --muted: #5A5F66; --line: #D9DCD5; --accent: #0B5F5B;
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1B1E21; --ink: #E8EAE4; --muted: #A2A8AE; --line: #2E3338; --accent: #4FB3AC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1B1E21; --ink: #E8EAE4; --muted: #A2A8AE; --line: #2E3338; --accent: #4FB3AC;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
header { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.bar strong { font-size: 18px; }
a { color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 64px; overflow-wrap: break-word; }
h1 { font-size: 28px; line-height: 1.2; margin: 24px 0 8px; }
h2 { font-size: 20px; margin: 40px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 24px 0 4px; }
.lead { color: var(--muted); font-size: 18px; margin: 0 0 16px; }
code { font: 14px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
pre { font: 13px/1.4 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; overflow-x: auto; }
table { border-collapse: collapse; } th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
li { margin: 4px 0; }
.source { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin-top: 40px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
.item h2 { font-size: 17px; margin: 0 0 4px; padding: 0; border: 0; }
.meta { color: var(--muted); font-size: 14px; margin: 0 0 8px; }
.item p { margin: 4px 0; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <strong>Sentinel</strong>
    <a href="/">Back to the suggestions</a>
  </div>
</header>
<main>
<h1>Fixed</h1>
<p class="lead" id="lead">Loading…</p>
<div id="fixed"></div>
</main>
<script>
// Everything shown comes from sentinel.db, partly derived from OBP-API logs: set as text, never as HTML.
const el = (tag, props, children = []) => { const e = Object.assign(document.createElement(tag), props); e.append(...children); return e; };
const fmtDate = (ts) => ts ? new Date(ts * 1000).toLocaleDateString() : '—';
const days = (a, b) => Math.max(0, Math.round((b - a) / 86400));
(async () => {
  try {
    const instances = await fetch('/api/instances').then((r) => r.json());
    const lists = await Promise.all(instances.map((i) =>
      fetch('/api/findings?instance=' + encodeURIComponent(i.name)).then((r) => r.json())
        .then((fs) => fs.filter((f) => f.status === 'fixed').map((f) => ({ ...f, instance: i.name })))));
    const fixed = lists.flat().sort((a, b) => (b.feedback?.ts ?? 0) - (a.feedback?.ts ?? 0));
    const many = instances.length > 1;
    document.getElementById('lead').textContent = fixed.length
      ? `${fixed.length} problem${fixed.length === 1 ? '' : 's'} Sentinel noticed and that were fixed since, newest first.`
      : 'Nothing marked fixed yet.';
    document.getElementById('fixed').replaceChildren(...fixed.map((f) => {
      const fixedAt = f.feedback?.ts;
      return el('article', { className: 'item' }, [
        el('h2', { textContent: f.title }),
        el('p', { className: 'meta', textContent: [many && f.instance, f.category,
          `noticed ${fmtDate(f.created_at)}`, `fixed ${fmtDate(fixedAt)}`,
          fixedAt && `${days(f.created_at, fixedAt)} days later`].filter(Boolean).join(' · ') }),
        ...(f.summary ? [el('p', { textContent: f.summary })] : []),
        ...(f.feedback?.comment ? [el('p', { textContent: f.feedback.comment })] : []),
      ]);
    }));
  } catch (e) {
    document.getElementById('lead').textContent = `Could not load the findings: ${e.message}`;
  }
})();
</script>
</body>
</html>
