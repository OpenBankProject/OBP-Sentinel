<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel Consents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>
// The theme chosen on the main page, if any
try { const t = localStorage.getItem('sentinel-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
</script>
<style>
:root {
  --bg: #F4F5F2; --surface: #FFFFFF; --ink: #16181D; --muted: #5A5F66; --line: #D9DCD5; --accent: #0B5F5B;
  --sans: 'IBM Plex Sans', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1B1E21; --ink: #E8EAE4; --muted: #A2A8AE; --line: #2E3338; --accent: #4FB3AC;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1B1E21; --ink: #E8EAE4; --muted: #A2A8AE; --line: #2E3338; --accent: #4FB3AC;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 var(--sans); }
header { background: var(--surface); border-bottom: 1px solid var(--line); }
.bar { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; }
.bar strong { font-size: 18px; }
a { color: var(--accent); }
main { max-width: 760px; margin: 0 auto; padding: 8px 16px 64px; overflow-wrap: break-word; }
h1 { font-size: 28px; line-height: 1.2; margin: 24px 0 8px; }
h2 { font-size: 20px; margin: 40px 0 8px; padding-top: 16px; border-top: 1px solid var(--line); }
h3 { font-size: 16px; margin: 24px 0 4px; }
.lead { color: var(--muted); font-size: 18px; margin: 0 0 16px; }
code { font: 14px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
pre { font: 13px/1.4 var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
  padding: 12px; overflow-x: auto; }
table { border-collapse: collapse; } th, td { border: 1px solid var(--line); padding: 4px 8px; text-align: left; }
li { margin: 4px 0; }
.source { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; margin-top: 40px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 12px 16px; margin: 12px 0; }
table { width: 100%; background: var(--surface); font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right; }
.wide { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <strong>Sentinel</strong>
    <a href="/">Back to the suggestions</a>
  </div>
</header>
<main>
<h1>Consents</h1>
<p class="lead">Calls made under a Consent, from OBP-API's aggregate metrics, over the last day. In <em>Users</em>,
a Consent's calls count as the human who granted it (on behalf of), not as the Consent's own user. Counts only:
Sentinel keeps no user or Consent ids.</p>
<div id="instances"><p>Loading…</p></div>
</main>
<script>
// Everything shown comes from sentinel.db: set as text, never as HTML.
const el = (tag, props, children = []) => { const e = Object.assign(document.createElement(tag), props); e.append(...children); return e; };
const fmtTime = (ts) => new Date(ts * 1000).toLocaleString([], { weekday: 'short', hour: '2-digit', minute: '2-digit' });
const num = (v) => v == null ? '—' : String(v);
const COLUMNS = [['Bucket', (b) => fmtTime(b.bucket_start)], ['Calls', (b) => num(b.count)],
  ['Consent calls', (b) => num(b.consent_calls)], ['Consents', (b) => num(b.distinct_consents)],
  ['Users', (b) => num(b.distinct_users)], ['Consumers', (b) => num(b.distinct_consumers)]];
function section(name, many, c) {
  const share = c.calls ? ` (${(100 * c.consent_calls / c.calls).toFixed(1)}%)` : '';
  const lead = !c.buckets ? 'No aggregate metrics in the last day.'
    : `${c.consent_calls} of ${c.calls} calls${share} were made under a Consent, in ${c.consent_buckets.length} of ` +
      `${c.buckets} buckets of ${c.bucket_minutes} minutes. Newest first; buckets with no Consent calls are left out.`;
  return [
    ...(many ? [el('h2', { textContent: name })] : []),
    el('p', { textContent: lead }),
    ...(c.consent_buckets.length ? [el('div', { className: 'wide' }, [el('table', {}, [
      el('thead', {}, [el('tr', {}, COLUMNS.map(([h], i) => el('th', { className: i ? 'n' : '', textContent: h })))]),
      el('tbody', {}, c.consent_buckets.map((b) =>
        el('tr', {}, COLUMNS.map(([, f], i) => el('td', { className: i ? 'n' : '', textContent: f(b) }))))),
    ])])] : []),
  ];
}
(async () => {
  const box = document.getElementById('instances');
  try {
    // Apps (API Explorer II, the Portal ...) have no aggregate metrics: only OBP-API instances
    const instances = (await fetch('/api/instances').then((r) => r.json())).filter((i) => !i.parent);
    const all = await Promise.all(instances.map((i) =>
      fetch('/api/consents?instance=' + encodeURIComponent(i.name)).then((r) => r.json())));
    box.replaceChildren(...instances.flatMap((i, n) => section(i.name, instances.length > 1, all[n])));
  } catch (e) {
    box.replaceChildren(el('p', { textContent: `Could not load the metrics: ${e.message}` }));
  }
})();
</script>
</body>
</html>
