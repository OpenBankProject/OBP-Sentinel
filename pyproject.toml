[project]
name = "senti"
version = "0.1.0"
description = "Senti: a long-running companion that watches your services and recommends the few improvements that matter most"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
senti = "senti.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senti"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
